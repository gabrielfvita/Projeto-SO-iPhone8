<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Latência ao toque — iPhone 8</title><style>
:root{--bg:#f3f6fb;--ink:#182640;--muted:#63738c;--line:#dfe7f1}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}main{max-width:1180px;margin:auto;padding:24px 18px 48px}.panel{background:#fff;border:1px solid var(--line);border-radius:22px;padding:30px 42px 24px;margin-bottom:22px;box-shadow:0 5px 24px #172a4810}.head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap}.eyebrow{font-size:13px;color:var(--muted);font-weight:750;letter-spacing:.08em;text-transform:uppercase}h2{font-size:clamp(25px,3vw,36px);letter-spacing:-.035em;margin:6px 0 5px}.sub{font-size:15px;color:var(--muted)}.plot{margin-top:13px}.plot svg{width:100%;height:auto;display:block}.legend{display:flex;gap:20px;align-items:center;flex-wrap:wrap;color:#60718b;font-size:13px;margin:2px 0 15px}.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:5px}.takeaway{font-size:17px;font-weight:700;line-height:1.4;margin:0 0 15px;color:#253650}.data{border-top:1px solid var(--line);padding-top:14px}summary{cursor:pointer;font-size:14px;font-weight:700;color:#50637d}details[open] summary{margin-bottom:12px}.tablewrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px;white-space:nowrap}th,td{border-bottom:1px solid #e7edf5;padding:10px 11px;text-align:right;font-variant-numeric:tabular-nums}th:first-child,td:first-child{text-align:left}th{background:#f5f8fc;color:#536680}.foot{font-size:12px;color:var(--muted);margin-top:10px}.end{font-size:16px;font-weight:700;text-align:center;color:#536580;margin:25px 0 0}@media(max-width:680px){main{padding:10px}.panel{padding:19px 14px;border-radius:16px;margin-bottom:12px}.legend{gap:9px;font-size:11px}.takeaway{font-size:14px}.plot{overflow-x:auto}.plot svg{min-width:520px}h2{font-size:25px}}@media print{body{background:white}main{padding:0}.panel{box-shadow:none;border-radius:0;break-inside:avoid;page-break-after:always;margin:0;padding:20px}.data{display:none}.end{display:none}}
</style></head><body><main id="root"></main><script>
const base1=[25,26,27,25,27,26,26,24,25,25],base2=[31,27,25,24,25,25,24,26,27,24];
const groups=[
{title:'Quantidade de tarefas',accent:'#11978e',axis:'Tarefas simultâneas',message:'Mais tarefas não aumentaram progressivamente a latência.',items:[['Sem carga',base1.concat(base2)],['2 tarefas',[27,28,28,23,26,28,26,27,28,27]],['3 tarefas',[27,20,23,19,21,19,20,22,18,21]],['6 tarefas',[27,21,21,24,21,23,22,23,21,20]]]},
{title:'Intensidade da CPU',accent:'#2763e7',axis:'Intensidade configurada',message:'Carga leve e pesada tiveram a mesma média: 95,00 ms.',items:[['Leve',[26,25,25,21,24,22,22,20,21,22]],['Média',[22,19,22,18,23,19,23,23,25,21]],['Pesada',[23,22,24,22,23,25,20,22,23,24]]]},
{title:'Duração da sobrecarga',accent:'#8156d8',axis:'Duração prévia da sobrecarga',message:'Entre 10 e 60 segundos, a média variou 3,33 ms.',items:[['10 s',[30,23,22,23,22,26,26,27,25,24]],['30 s',[30,26,22,20,24,26,26,25,27,24]],['60 s',[24,27,24,25,24,22,22,23,25,24]]]}];
const ms=n=>n*1000/240,mean=a=>a.reduce((s,v)=>s+v,0)/a.length,fmt=n=>n.toFixed(2).replace('.',','),reference=ms(mean(base1.concat(base2)));
function chart(g){const W=1040,H=340,L=82,R=44,T=33,B=68,MAX=140,plotH=H-T-B,plotW=W-L-R;const y=v=>T+plotH-v/MAX*plotH;let out=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Médias da frente ${g.title}">`;
for(let tick=0;tick<=140;tick+=20){const yy=y(tick);out+=`<line x1="${L}" y1="${yy}" x2="${W-R}" y2="${yy}" stroke="${tick===0?'#b4c2d4':'#e6ecf3'}" stroke-width="${tick===0?2:1}"/><text x="${L-16}" y="${yy+5}" text-anchor="end" font-size="16" fill="#65758e">${tick}</text>`}
out+=`<text x="${L}" y="19" font-size="16" font-weight="700" fill="#50627d">Latência (ms)</text>`;
const yr=y(reference);out+=`<line x1="${L}" y1="${yr}" x2="${W-R}" y2="${yr}" stroke="#e39a46" stroke-width="2.5" stroke-dasharray="8 7"/><text x="${W-R-5}" y="${yr-9}" text-anchor="end" fill="#bb772c" font-size="14" font-weight="750">Sem carga: ${fmt(reference)} ms</text>`;
const slot=plotW/g.items.length,barW=Math.min(142,slot*.53);
g.items.forEach(([name,arr],i)=>{const cx=L+slot*(i+.5),avg=ms(mean(arr)),barY=y(avg),baseY=y(0);out+=`<rect x="${cx-barW/2}" y="${barY}" width="${barW}" height="${baseY-barY}" rx="7" fill="${g.accent}" opacity=".88"/>`;
out+=`<text x="${cx}" y="${barY-15}" text-anchor="middle" font-size="21" font-weight="800" fill="${g.accent}">${fmt(avg)}</text><text x="${cx}" y="${H-43}" text-anchor="middle" font-size="18" font-weight="700" fill="#31435d">${name}</text>`});
out+=`<text x="${W/2}" y="${H-9}" text-anchor="middle" font-size="15" font-weight="600" fill="#66778f">${g.axis}</text></svg>`;return out}
function table(g){return `<details class="data"><summary>Ver tabela e medições individuais</summary><div class="tablewrap"><table><thead><tr><th>Condição</th><th>N</th><th>Média (ms)</th><th>Mín. (ms)</th><th>Máx. (ms)</th><th>Toques individuais (frames)</th></tr></thead><tbody>${g.items.map(([name,a])=>`<tr><td>${name}</td><td>${a.length}</td><td>${fmt(ms(mean(a)))}</td><td>${fmt(ms(Math.min(...a)))}</td><td>${fmt(ms(Math.max(...a)))}</td><td>${a.join(' · ')}</td></tr>`).join('')}</tbody></table></div><div class="foot">240 FPS · 1 frame = 4,1667 ms · A referência sem carga reúne duas sessões de 10 toques; as demais condições têm 10 toques cada.</div></details>`}
document.querySelector('#root').innerHTML=groups.map((g,i)=>`<section class="panel"><div class="head"><div><div class="eyebrow">Frente ${i+1} / 3</div><h2>${g.title}</h2></div><div class="sub">iPhone 8 · iOS 15.6 · 240 FPS</div></div><div class="plot">${chart(g)}</div><div class="legend"><span><i style="background:${g.accent}"></i>Média (barras)</span><span><i style="background:#e39a46"></i>Referência sem carga</span></div><p class="takeaway">${g.message}</p>${table(g)}</section>`).join('')+`<div class="end">Nas três frentes, a latência não aumentou progressivamente com a sobrecarga.</div>`;
</script></body></html>
